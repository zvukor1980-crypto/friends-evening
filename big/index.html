<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Друзья"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'none'"><title>Друзья — Большой вечер</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../hubback.css"><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../icon-180.png"></head><body>
<section id="titleScreen"><div class="titleShade"></div><div class="titleContent"><div class="eyebrow">ФОТОГРАФИИ СТАНОВЯТСЯ ИСТОРИЯМИ</div><h1>Друзья<br><em>Большой вечер</em></h1><p>У одного места может быть много историй.<br>Помоги друзьям собрать их вместе.</p><div class="titleButtons"><button id="start" class="gold">Новая история <span>↗</span></button><button id="continue" hidden>Продолжить</button><button id="titleSaves">Сохранения</button></div><div class="titleFacts">6 глав <i></i> 8 локаций <i></i> 10 личных историй</div><div class="small titleNote">Исследование комнат · предметы · головоломки · разные финалы</div></div></section>
<main id="game" hidden><header><button id="logo" aria-label="Главное меню">ДРУЗЬЯ <span>БОЛЬШОЙ ВЕЧЕР</span></button><div id="chapterLabel"></div><div class="topActions"><button id="musicButton">♫ Музыка выкл.</button><button id="albumButton">Фотоальбом</button><button id="menuButton">Меню <kbd>Esc</kbd></button></div></header>
<nav id="roomNav" aria-label="Комнаты"><div class="eyebrow">МЕСТА</div><div id="roomButtons"></div><button id="mapButton" class="navExtra">Карта дома <kbd>M</kbd></button><button id="journalButton" class="navExtra">Записная книжка <kbd>J</kbd></button><button id="hintButton" class="navExtra">Подсказка <kbd>H</kbd></button></nav>
<section id="scene"><div class="roomHeading"><div><div id="roomSub" class="eyebrow"></div><h2 id="roomName"></h2></div><button id="highlight" title="Показать места для осмотра">◎ Объекты</button></div><div id="roomImage"><img id="background" alt="Текущая комната"><div class="roomVignette"></div><div id="hotspots"></div><img id="decorPhoto" hidden alt="Выбранная фотография в экспозиции"></div><div id="roomDescription"></div></section>
<aside id="sidebar"><div class="eyebrow">СЕЙЧАС ВАЖНО</div><h3 id="chapterName"></h3><div id="goalList"></div><div class="peopleHeading eyebrow">РЯДОМ С ТОБОЙ</div><div id="people"></div><div id="progressLine"></div></aside>
<section id="inventory"><div class="inventoryLabel">ТВОИ ВЕЩИ <button id="clearItem" hidden>Убрать выбор ×</button></div><div id="items"></div></section></main>
<dialog id="panel"><button class="close" data-close="panel" aria-label="Закрыть">×</button><div id="panelContent"></div></dialog>
<dialog id="conversation"><button class="close" data-close="conversation" aria-label="Закрыть">×</button><div class="conversationLayout"><div class="actorFrame"><img id="actorStill" alt="Героиня"><video id="actor" muted loop playsinline></video></div><div class="conversationText"><div id="actorRole" class="eyebrow"></div><h2 id="actorName"></h2><div id="actorWords" class="prose"></div><div id="actorChoices" class="actions"></div></div></div></dialog>
<dialog id="puzzle"><button class="close" data-close="puzzle" aria-label="Закрыть">×</button><div id="puzzleContent"></div></dialog>
<dialog id="cinema"><div class="cinemaHeader"><div><div class="eyebrow" id="cinemaChapter"></div><h3 id="cinemaTitle"></h3></div><button id="skipCinema">Продолжить без просмотра →</button></div><video id="film" muted playsinline controls></video><div class="cinemaBottom"><span id="cinemaCount"></span><button id="nextCinema">Следующая сцена →</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><audio id="music" src="assets/music.mp3" loop preload="none"></audio><script src="world.js"></script><script src="rules.js"></script><script src="app.js"></script><script src="qa-renderer.js"></script><a href="../" class="hubback" aria-label="Меню">⌂</a><script src="../reg.js"></script></body></html>
